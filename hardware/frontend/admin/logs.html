<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Logs - RFID Toll System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0D0F14;
            --bg-secondary: #161A24;
            --bg-tertiary: #1E2433;
            --accent-amber: #F5A623;
            --accent-green: #00FF88;
            --accent-red: #FF3B4E;
            --text-primary: #E8ECF0;
            --text-muted: #6B7A99;
            --border: #2A3148;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'IBM Plex Mono', monospace;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px; background-color: var(--bg-secondary); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 10;
        }
        .logo-container { padding: 32px 24px; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; letter-spacing: 2px; }
        .cursor { color: var(--accent-amber); animation: blink 1s step-end infinite; }
        .nav-menu { flex: 1; padding: 24px 0; list-style: none; }
        .nav-item {
            padding: 16px 24px; display: flex; align-items: center; gap: 12px;
            color: var(--text-muted); text-decoration: none; transition: all 0.3s;
            border-left: 3px solid transparent; cursor: pointer;
        }
        .nav-item:hover { background-color: var(--bg-tertiary); color: var(--text-primary); }
        .nav-item.active { border-left-color: var(--accent-amber); color: var(--accent-amber); background-color: rgba(245, 166, 35, 0.05); }
        .operator-badge { padding: 24px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; font-size: 0.8rem; }
        .dot-green { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 240px; flex: 1; padding: 32px; display: flex; flex-direction: column; gap: 20px; transition: filter 0.3s;
        }

        .topbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .page-title { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; letter-spacing: 2px; }
        
        .btn-outline {
            background: transparent; color: var(--accent-amber); border: 1px solid var(--accent-amber);
            font-family: 'Orbitron', sans-serif; padding: 10px 20px; cursor: pointer; transition: all 0.3s;
        }
        .btn-outline:hover { background: rgba(245, 166, 35, 0.1); }

        /* Filter Bar */
        .filter-bar {
            display: flex; gap: 16px; background-color: var(--bg-secondary); padding: 16px; border: 1px solid var(--border); align-items: center; flex-wrap: wrap;
        }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-label { color: var(--text-muted); font-size: 0.85rem; }
        .form-control {
            background-color: var(--bg-primary); border: 1px solid var(--border); color: var(--text-primary);
            padding: 8px 12px; font-family: 'IBM Plex Mono', monospace; outline: none; transition: border 0.3s;
        }
        .form-control:focus { border-color: var(--accent-amber); }
        
        .pill-toggle {
            display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
        }
        .pill-btn {
            background: var(--bg-primary); color: var(--text-muted); border: none; padding: 8px 16px; cursor: pointer; font-family: 'IBM Plex Mono'; border-right: 1px solid var(--border);
        }
        .pill-btn:last-child { border-right: none; }
        .pill-btn.active { background: var(--bg-tertiary); color: var(--text-primary); font-weight: bold; }

        .btn-apply { background: var(--accent-amber); color: #000; border: none; padding: 8px 24px; font-family: 'Orbitron'; cursor: pointer; font-weight: bold; margin-left: auto; }

        /* Summary Strip */
        .summary-strip {
            display: flex; gap: 32px; background: rgba(30, 36, 51, 0.5); padding: 12px 24px; border-left: 3px solid var(--accent-blue); font-size: 0.95rem;
        }
        .summary-item span { color: var(--text-muted); margin-right: 8px; }
        .summary-item strong { font-family: 'Orbitron'; font-weight: 500; }

        /* Data Table */
        .table-container { background-color: var(--bg-secondary); border: 1px solid var(--border); overflow-x: auto; flex: 1; }
        table { width: 100%; border-collapse: collapse; font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem; letter-spacing: 0.5px; }
        th { text-align: left; color: var(--text-muted); padding: 16px; border-bottom: 1px solid var(--border); font-weight: 500; }
        td { padding: 16px; border-bottom: 1px solid rgba(42, 49, 72, 0.5); transition: background-color 0.2s; cursor: pointer; }
        
        tbody tr:hover { background-color: rgba(245, 166, 35, 0.05); }
        tbody tr.row-auth { background-color: rgba(0, 255, 136, 0.02); }
        tbody tr.row-denied { background-color: rgba(255, 59, 78, 0.03); }
        tbody tr.row-auth:hover { background-color: rgba(0, 255, 136, 0.08); }
        tbody tr.row-denied:hover { background-color: rgba(255, 59, 78, 0.08); }

        .table-fade-in { animation: fadeIn 0.4s ease-out; }

        .txn-id { color: var(--accent-amber); font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; }
        .datetime { color: var(--text-muted); font-size: 0.9rem; }
        
        .badge { padding: 4px 8px; border-radius: 2px; font-size: 0.8rem; font-family: 'IBM Plex Mono', monospace; border: 1px solid transparent; }
        .badge.auth { background-color: rgba(0, 255, 136, 0.1); color: var(--accent-green); border-color: var(--accent-green); }
        .badge.denied { background-color: rgba(255, 59, 78, 0.1); color: var(--accent-red); border-color: var(--accent-red); }

        /* Pagination */
        .pagination { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .page-btn {
            background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary);
            padding: 8px 12px; cursor: pointer; font-family: 'IBM Plex Mono'; transition: all 0.2s;
        }
        .page-btn:hover { border-color: var(--accent-amber); }
        .page-btn.active { background: var(--accent-amber); color: #000; border-color: var(--accent-amber); font-weight: bold; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Right Drawer */
        .drawer {
            position: fixed; top: 0; right: -400px; width: 400px; height: 100vh;
            background-color: var(--bg-secondary); border-left: 1px solid var(--accent-amber);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5); z-index: 100; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
        }
        .drawer.open { right: 0; }
        
        .drawer-header {
            padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        .drawer-title { font-family: 'Orbitron'; font-size: 1.2rem; color: var(--accent-amber); }
        .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .btn-close:hover { color: var(--accent-red); }

        .drawer-content { padding: 24px; flex: 1; overflow-y: auto; }
        .detail-group { margin-bottom: 20px; border-bottom: 1px dashed var(--border); padding-bottom: 12px; }
        .detail-label { color: var(--text-muted); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 4px; }
        .detail-value { font-size: 1.1rem; color: var(--text-primary); }
        .detail-value.monospace { font-family: 'IBM Plex Mono'; font-size: 1rem; }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-container">
            <div class="logo">RFID_TOLL<span class="cursor">_</span></div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item" onclick="window.location.href='dashboard.html'">◉ Dashboard</li>
            <li class="nav-item" onclick="window.location.href='vehicles.html'">☰ Vehicles</li>
            <li class="nav-item active" onclick="window.location.href='logs.html'">✦ Transaction Logs</li>
            <li class="nav-item" onclick="window.location.href='reports.html'">◎ Reports</li>
            <li class="nav-item" style="margin-top: auto; color: var(--accent-red);" onclick="window.location.href='login.html'">⊗ Logout</li>
        </ul>
        <div class="operator-badge">
            <div class="dot-green"></div>
            <div>
                <div style="color: var(--text-primary);">admin</div>
                <div style="color: var(--text-muted); font-size: 0.7rem;">SYSTEM ONLINE</div>
            </div>
        </div>
    </nav>

    <main class="main-content" id="mainContent">
        
        <header class="topbar">
            <h1 class="page-title">TRANSACTION LOGS</h1>
            <button class="btn-outline" id="btnExport">[↓ Export CSV]</button>
        </header>

        <div class="filter-bar">
            <div class="filter-group">
                <span class="filter-label">DATE RANGE:</span>
                <input type="date" class="form-control" id="dateFrom" value="2026-04-10">
                <span class="filter-label">TO</span>
                <input type="date" class="form-control" id="dateTo" value="2026-04-17">
            </div>

            <div class="filter-group" style="margin-left: 16px;">
                <span class="filter-label">STATUS:</span>
                <div class="pill-toggle">
                    <button class="pill-btn active" data-status="ALL">All</button>
                    <button class="pill-btn" data-status="AUTHORIZED">Authorized</button>
                    <button class="pill-btn" data-status="DENIED">Denied</button>
                </div>
            </div>

            <button class="btn-apply" id="btnApply">APPLY FILTERS</button>
        </div>

        <div class="summary-strip">
            <div class="summary-item"><span>Total Txns:</span> <strong id="sumTxns">0</strong></div>
            <div class="summary-item"><span>Total Revenue:</span> <strong id="sumRev" style="color: var(--accent-green);">₹0</strong></div>
            <div class="summary-item"><span>Denied Attempts:</span> <strong id="sumDenied" style="color: var(--accent-red);">0</strong></div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>TXN_ID</th>
                        <th>DATE & TIME</th>
                        <th>RFID_UID</th>
                        <th>VEHICLE_NO</th>
                        <th>OWNER</th>
                        <th>AMOUNT</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                </tbody>
            </table>
        </div>

        <div class="pagination" id="paginationControls">
        </div>

    </main>

    <div class="drawer" id="logDrawer">
        <div class="drawer-header">
            <div class="drawer-title">TRANSACTION DETAIL</div>
            <button class="btn-close" id="btnCloseDrawer">×</button>
        </div>
        <div class="drawer-content" id="drawerContent">
        </div>
    </div>

    <script>
        // 1. Generate Mock Data
        const mockVehicles = [
            { uid: "8D 20 06 85", veh: "MH-04-AB-1234", name: "Fawwaz Mohd Ubaid" },
            { uid: "A1 B2 C3 D4", veh: "UP-32-CD-5678", name: "Ayyub Waqar Faridi" },
            { uid: "F1 E2 D3 C4", veh: "DL-01-XY-9999", name: "Thanaphong T." },
            { uid: "12 34 56 78", veh: "KA-05-PQ-3344", name: "Madani Hassan" },
            { uid: "AA BB CC DD", veh: "TN-11-ZZ-7788", name: "Abdalla Haroun" }
        ];

        let logsData = [];
        let baseTxnId = 832;
        
        for(let i = 0; i < 15; i++) {
            const v = mockVehicles[Math.floor(Math.random() * mockVehicles.length)];
            const isDenied = Math.random() > 0.8; 
            
            const date = new Date(2026, 3, 16, 14, 30, 0); 
            date.setHours(date.getHours() - (i * 13)); 

            logsData.push({
                id: `TXN-${baseTxnId + (15 - i)}`,
                timestamp: date.toISOString().slice(0,19).replace('T', ' '),
                uid: v.uid,
                veh: v.veh,
                name: v.name,
                status: isDenied ? 'DENIED' : 'AUTHORIZED',
                amount: isDenied ? 0 : 100,
                balBefore: isDenied ? (Math.floor(Math.random() * 50)) : (Math.floor(Math.random() * 1000) + 100), 
                responseTime: (Math.random() * 0.8 + 0.2).toFixed(2) 
            });
        }

        let currentFilterStatus = 'ALL';
        let currentPage = 1;
        const itemsPerPage = 10;
        let filteredData = [...logsData];

        const tbody = document.getElementById('logTableBody');
        const paginationContainer = document.getElementById('paginationControls');
        const sumTxns = document.getElementById('sumTxns');
        const sumRev = document.getElementById('sumRev');
        const sumDenied = document.getElementById('sumDenied');
        const drawer = document.getElementById('logDrawer');
        const mainContent = document.getElementById('mainContent');

        function renderTable() {
            tbody.innerHTML = '';
            
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);

            pageData.forEach(log => {
                const tr = document.createElement('tr');
                const isAuth = log.status === 'AUTHORIZED';
                tr.className = isAuth ? 'row-auth table-fade-in' : 'row-denied table-fade-in';
                
                const amtDisplay = isAuth ? `<span style="color: var(--accent-green)">₹${log.amount}</span>` : `<span style="color: var(--accent-red); text-decoration: line-through;">₹100</span>`;
                const badgeClass = isAuth ? 'badge auth' : 'badge denied';

                tr.innerHTML = `
                    <td class="txn-id">#${log.id}</td>
                    <td class="datetime">${log.timestamp}</td>
                    <td class="txn-id" style="color: var(--text-primary)">${log.uid}</td>
                    <td>${log.veh}</td>
                    <td>${log.name}</td>
                    <td>${amtDisplay}</td>
                    <td><span class="${badgeClass}">${log.status}</span></td>
                `;

                tr.addEventListener('click', () => openDrawer(log));
                tbody.appendChild(tr);
            });

            updateSummary();
            renderPagination();
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            
            if(totalPages === 0) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerText = '← Prev';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; renderTable(); };
            paginationContainer.appendChild(prevBtn);

            for(let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${currentPage === i ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; renderTable(); };
                paginationContainer.appendChild(btn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerText = 'Next →';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { currentPage++; renderTable(); };
            paginationContainer.appendChild(nextBtn);
        }

        function updateSummary() {
            const txns = filteredData.length;
            const rev = filteredData.reduce((sum, log) => sum + log.amount, 0);
            const denied = filteredData.filter(log => log.status === 'DENIED').length;

            sumTxns.innerText = txns;
            sumRev.innerText = `₹${rev}`;
            sumDenied.innerText = denied;
        }

        const pillBtns = document.querySelectorAll('.pill-btn');
        pillBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                pillBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilterStatus = e.target.getAttribute('data-status');
            });
        });

        document.getElementById('btnApply').addEventListener('click', () => {
            filteredData = logsData.filter(log => {
                if(currentFilterStatus !== 'ALL' && log.status !== currentFilterStatus) return false;
                return true;
            });
            currentPage = 1;
            renderTable();
        });

        function openDrawer(log) {
            const isAuth = log.status === 'AUTHORIZED';
            const balAfter = isAuth ? log.balBefore - log.amount : log.balBefore;
            const statusColor = isAuth ? 'var(--accent-green)' : 'var(--accent-red)';
            const reason = isAuth ? 'SUCCESS' : 'INSUFFICIENT FUNDS';

            document.getElementById('drawerContent').innerHTML = `
                <div class="detail-group">
                    <div class="detail-label">TRANSACTION ID</div>
                    <div class="detail-value monospace" style="color: var(--accent-amber)">#${log.id}</div>
                </div>
                <div class="detail-group">
                    <div class="detail-label">TIMESTAMP</div>
                    <div class="detail-value">${log.timestamp}</div>
                </div>
                <div class="detail-group">
                    <div class="detail-label">RFID UID</div>
                    <div class="detail-value monospace">${log.uid}</div>
                </div>
                <div class="detail-group">
                    <div class="detail-label">VEHICLE INFO</div>
                    <div class="detail-value">${log.veh}</div>
                    <div class="detail-value" style="color: var(--text-muted); font-size: 0.9rem;">${log.name}</div>
                </div>
                <div class="detail-group">
                    <div class="detail-label">STATUS & REASON</div>
                    <div class="detail-value" style="color: ${statusColor}; font-family: 'Orbitron'">${log.status}</div>
                    <div class="detail-value" style="color: var(--text-muted); font-size: 0.9rem;">Reason: ${reason}</div>
                </div>
                <div class="detail-group">
                    <div class="detail-label">FINANCIALS</div>
                    <div class="detail-value">Toll Amount: ₹${log.amount}</div>
                    <div class="detail-value" style="font-size: 0.9rem; color: var(--text-muted); margin-top: 8px;">Balance Before: ₹${log.balBefore}</div>
                    <div class="detail-value" style="font-size: 0.9rem; color: var(--text-muted);">Balance After: ₹${balAfter}</div>
                </div>
                <div class="detail-group" style="border: none;">
                    <div class="detail-label">SYSTEM METRICS</div>
                    <div class="detail-value monospace">Response Time: ${log.responseTime}s</div>
                </div>
            `;
            
            drawer.classList.add('open');
            mainContent.style.filter = 'brightness(0.5)'; 
        }

        document.getElementById('btnCloseDrawer').addEventListener('click', () => {
            drawer.classList.remove('open');
            mainContent.style.filter = 'none';
        });

        document.getElementById('btnExport').addEventListener('click', function() {
            const originalText = this.innerText;
            this.innerText = 'EXPORTING...';
            this.style.color = 'var(--text-primary)';
            
            setTimeout(() => {
                this.innerText = '✓ EXPORTED';
                this.style.color = 'var(--accent-green)';
                this.style.borderColor = 'var(--accent-green)';
                
                setTimeout(() => {
                    this.innerText = originalText;
                    this.style.color = 'var(--accent-amber)';
                    this.style.borderColor = 'var(--accent-amber)';
                }, 2000);
            }, 800);
        });

        renderTable();
    </script>
</body>
</html>
