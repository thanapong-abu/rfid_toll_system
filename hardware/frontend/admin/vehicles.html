<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Registry - RFID Toll System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0D0F14;
            --bg-secondary: #161A24;
            --bg-tertiary: #1E2433;
            --accent-amber: #F5A623;
            --accent-green: #00FF88;
            --accent-red: #FF3B4E;
            --text-primary: #E8ECF0;
            --text-muted: #6B7A99;
            --border: #2A3148;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'IBM Plex Mono', monospace;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scanline Overlay */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px; background-color: var(--bg-secondary); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 10;
        }
        .logo-container { padding: 32px 24px; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; letter-spacing: 2px; }
        .cursor { color: var(--accent-amber); animation: blink 1s step-end infinite; }
        .nav-menu { flex: 1; padding: 24px 0; list-style: none; }
        .nav-item {
            padding: 16px 24px; display: flex; align-items: center; gap: 12px;
            color: var(--text-muted); text-decoration: none; transition: all 0.3s;
            border-left: 3px solid transparent; cursor: pointer;
        }
        .nav-item:hover { background-color: var(--bg-tertiary); color: var(--text-primary); }
        .nav-item.active {
            border-left-color: var(--accent-amber); color: var(--accent-amber);
            background-color: rgba(245, 166, 35, 0.05);
        }
        .operator-badge {
            padding: 24px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; font-size: 0.8rem;
        }
        .dot-green { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 240px; flex: 1; padding: 32px; display: flex; flex-direction: column; gap: 24px;
        }

        /* Topbar */
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 16px; border-bottom: 1px solid var(--border);
        }
        .page-title { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; letter-spacing: 2px; }
        
        .btn-primary {
            background-color: var(--accent-amber); color: #000; font-family: 'Orbitron', sans-serif;
            font-weight: 700; padding: 10px 20px; border: none; cursor: pointer; transition: all 0.3s;
        }
        .btn-primary:hover { filter: brightness(1.1); box-shadow: 0 0 15px rgba(245, 166, 35, 0.3); }

        /* Search & Filter Bar */
        .toolbar {
            display: flex; gap: 16px; background-color: var(--bg-secondary);
            padding: 16px; border: 1px solid var(--border); align-items: center;
        }
        .search-input {
            flex: 1; background-color: var(--bg-primary); border: 1px solid var(--border);
            color: var(--text-primary); padding: 10px 16px; font-family: 'IBM Plex Mono', monospace; outline: none; transition: border 0.3s;
        }
        .search-input:focus, .filter-select:focus { border-color: var(--accent-amber); }
        .filter-select {
            background-color: var(--bg-primary); border: 1px solid var(--border); color: var(--text-primary);
            padding: 10px 16px; font-family: 'IBM Plex Mono', monospace; outline: none; width: 200px;
        }

        /* Stats Bar */
        .stats-bar { color: var(--text-muted); font-size: 0.9rem; margin-top: -8px; }

        /* Data Table */
        .table-container { background-color: var(--bg-secondary); border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem; letter-spacing: 0.5px; }
        th { text-align: left; color: var(--text-muted); padding: 16px; border-bottom: 1px solid var(--border); font-weight: 500; }
        td { padding: 16px; border-bottom: 1px solid rgba(42, 49, 72, 0.5); transition: background-color 0.3s; }
        
        tbody tr:nth-child(even) { background-color: rgba(30, 36, 51, 0.3); }
        tbody tr:hover { background-color: rgba(245, 166, 35, 0.05); }
        
        .row-animate { animation: slideDownFade 0.5s ease-out forwards; opacity: 0; }
        
        .uid-col { color: var(--accent-amber); font-family: 'IBM Plex Mono', monospace; background: rgba(245, 166, 35, 0.1); padding: 4px 8px; border-radius: 2px; }
        
        .badge { padding: 4px 8px; border-radius: 2px; font-size: 0.8rem; font-family: 'IBM Plex Mono', monospace; border: 1px solid transparent; }
        .badge.active { background-color: rgba(0, 255, 136, 0.1); color: var(--accent-green); border-color: var(--accent-green); }
        .badge.suspended { background-color: rgba(255, 59, 78, 0.1); color: var(--accent-red); border-color: var(--accent-red); }
        .badge.low-bal { background-color: rgba(255, 59, 78, 0.2); color: var(--accent-red); border-color: var(--accent-red); margin-left: 8px; }

        .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; margin-right: 12px; transition: color 0.2s; }
        .action-btn:hover { color: var(--accent-amber); }
        .action-btn.suspend:hover { color: var(--accent-red); }

        /* MODAL SYSTEM */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(13, 15, 20, 0.85); display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 50;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        
        .modal-card {
            width: 480px; background-color: var(--bg-secondary); border: 1px solid var(--border);
            padding: 32px; box-shadow: 0 0 40px rgba(245, 166, 35, 0.08);
            transform: translateY(-20px); transition: transform 0.3s ease-out;
        }
        .modal-overlay.open .modal-card { transform: translateY(0); }

        .modal-header { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; margin-bottom: 24px; color: var(--accent-amber); border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; letter-spacing: 1px; }
        .form-control { width: 100%; background-color: var(--bg-tertiary); border: none; border-bottom: 1px solid var(--border); color: var(--text-primary); font-family: 'IBM Plex Mono', monospace; padding: 12px; outline: none; }
        .form-control:focus { border-bottom-color: var(--accent-amber); }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 16px; margin-top: 32px; }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 10px 20px; font-family: 'Orbitron'; cursor: pointer; transition: color 0.3s; }
        .btn-cancel:hover { color: var(--text-primary); }

        .flash-update { animation: flashRow 1s ease-out; }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes slideDownFade { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes flashRow { 0% { background-color: rgba(245, 166, 35, 0.4); } 100% { background-color: transparent; } }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-container">
            <div class="logo">RFID_TOLL<span class="cursor">_</span></div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item" onclick="window.location.href='dashboard.html'">◉ Dashboard</li>
            <li class="nav-item active" onclick="window.location.href='vehicles.html'">☰ Vehicles</li>
            <li class="nav-item" onclick="window.location.href='logs.html'">✦ Transaction Logs</li>
            <li class="nav-item" onclick="window.location.href='reports.html'">◎ Reports</li>
            <li class="nav-item" style="margin-top: auto; color: var(--accent-red);" onclick="window.location.href='login.html'">⊗ Logout</li>
        </ul>
        <div class="operator-badge">
            <div class="dot-green"></div>
            <div>
                <div style="color: var(--text-primary);">admin</div>
                <div style="color: var(--text-muted); font-size: 0.7rem;">SYSTEM ONLINE</div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        
        <header class="topbar">
            <h1 class="page-title">VEHICLE REGISTRY</h1>
            <button class="btn-primary" id="btnOpenRegister">+ REGISTER NEW VEHICLE</button>
        </header>

        <div class="toolbar">
            <input type="text" class="search-input" id="searchInput" placeholder="Search by UID, vehicle no, or owner...">
            <select class="filter-select" id="filterSelect">
                <option value="ALL">All Vehicles</option>
                <option value="ACTIVE">Active</option>
                <option value="SUSPENDED">Suspended</option>
                <option value="LOW">Low Balance (< ₹300)</option>
            </select>
        </div>

        <div class="stats-bar" id="statsBar">
            Loading stats...
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>RFID UID</th>
                        <th>VEHICLE NO</th>
                        <th>OWNER NAME</th>
                        <th>WALLET BAL</th>
                        <th>STATUS</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="vehicleTableBody">
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="registerModal">
        <div class="modal-card">
            <div class="modal-header">REGISTER NEW VEHICLE</div>
            <div class="form-group">
                <label>RFID UID (HEX)</label>
                <input type="text" class="form-control" placeholder="e.g. FF AA 11 22">
            </div>
            <div class="form-group">
                <label>VEHICLE NUMBER</label>
                <input type="text" class="form-control" placeholder="e.g. UP-32-XX-0000">
            </div>
            <div class="form-group">
                <label>OWNER NAME</label>
                <input type="text" class="form-control" placeholder="Full Name">
            </div>
            <div class="form-group">
                <label>INITIAL BALANCE (₹)</label>
                <input type="number" class="form-control" value="500">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModals()">CANCEL</button>
                <button class="btn-primary">REGISTER &rarr;</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="topupModal">
        <div class="modal-card">
            <div class="modal-header">TOP-UP WALLET</div>
            <div style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;" id="topupTargetInfo">
                Target: --
            </div>
            <div class="form-group">
                <label>AMOUNT TO ADD (₹)</label>
                <input type="number" id="topupAmount" class="form-control" value="500" step="100">
            </div>
            <input type="hidden" id="topupUid">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModals()">CANCEL</button>
                <button class="btn-primary" onclick="confirmTopup()">CONFIRM TOP-UP &rarr;</button>
            </div>
        </div>
    </div>

    <script>
        // Mock Data based on the project parameters
        let vehicles = [
            { id: 1, uid: "8D 20 06 85", veh: "MH-04-AB-1234", name: "Fawwaz Mohd Ubaid", bal: 850, status: "ACTIVE" },
            { id: 2, uid: "A1 B2 C3 D4", veh: "UP-32-CD-5678", name: "Ayyub Waqar Faridi", bal: 1200, status: "ACTIVE" },
            { id: 3, uid: "F1 E2 D3 C4", veh: "DL-01-XY-9999", name: "Thanaphong T.", bal: 200, status: "ACTIVE" },
            { id: 4, uid: "12 34 56 78", veh: "KA-05-PQ-3344", name: "Madani Hassan", bal: 3000, status: "ACTIVE" },
            { id: 5, uid: "AA BB CC DD", veh: "TN-11-ZZ-7788", name: "Abdalla Haroun", bal: 560, status: "ACTIVE" }
        ];

        const tbody = document.getElementById('vehicleTableBody');
        const statsBar = document.getElementById('statsBar');
        const searchInput = document.getElementById('searchInput');
        const filterSelect = document.getElementById('filterSelect');
        const registerModal = document.getElementById('registerModal');
        const topupModal = document.getElementById('topupModal');

        function renderTable() {
            const searchTerm = searchInput.value.toLowerCase();
            const filterVal = filterSelect.value;
            
            tbody.innerHTML = '';
            let lowCount = 0;
            let suspCount = 0;
            let displayCount = 0;

            vehicles.forEach((v, index) => {
                const isLow = v.bal < 300;
                if(isLow) lowCount++;
                if(v.status === 'SUSPENDED') suspCount++;

                const matchesSearch = v.uid.toLowerCase().includes(searchTerm) || 
                                      v.veh.toLowerCase().includes(searchTerm) || 
                                      v.name.toLowerCase().includes(searchTerm);
                
                let matchesFilter = true;
                if(filterVal === 'ACTIVE' && v.status !== 'ACTIVE') matchesFilter = false;
                if(filterVal === 'SUSPENDED' && v.status !== 'SUSPENDED') matchesFilter = false;
                if(filterVal === 'LOW' && !isLow) matchesFilter = false;

                if(matchesSearch && matchesFilter) {
                    displayCount++;
                    const tr = document.createElement('tr');
                    tr.className = 'row-animate';
                    tr.style.animationDelay = `${displayCount * 50}ms`;
                    tr.id = `row-${v.uid.replace(/ /g, '-')}`;

                    const balStyle = isLow ? 'color: var(--accent-red); font-weight: bold;' : '';
                    const lowBadge = isLow ? '<span class="badge low-bal">⚠ LOW</span>' : '';
                    const statusBadge = v.status === 'ACTIVE' ? '<span class="badge active">ACTIVE</span>' : '<span class="badge suspended">SUSPENDED</span>';

                    tr.innerHTML = `
                        <td>${v.id}</td>
                        <td><span class="uid-col">${v.uid}</span></td>
                        <td>${v.veh}</td>
                        <td>${v.name}</td>
                        <td style="${balStyle}">₹${v.bal} ${lowBadge}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="action-btn" title="Edit">✎</button>
                            <button class="action-btn" title="Top-up Wallet" onclick="openTopup('${v.uid}', '${v.veh}', '${v.name}')">₹</button>
                            <button class="action-btn suspend" title="Suspend">⊗</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                }
            });

            statsBar.innerHTML = `<span style="color:var(--text-primary)">${vehicles.length}</span> Registered Vehicles | <span style="color:var(--accent-red)">${lowCount}</span> Low Balance | <span style="color:var(--accent-red)">${suspCount}</span> Suspended`;
        }

        searchInput.addEventListener('input', renderTable);
        filterSelect.addEventListener('change', renderTable);

        document.getElementById('btnOpenRegister').addEventListener('click', () => registerModal.classList.add('open'));
        
        function closeModals() {
            registerModal.classList.remove('open');
            topupModal.classList.remove('open');
        }

        function openTopup(uid, veh, name) {
            document.getElementById('topupTargetInfo').innerText = `Target: ${veh} (${name}) | UID: ${uid}`;
            document.getElementById('topupUid').value = uid;
            document.getElementById('topupAmount').value = 500;
            topupModal.classList.add('open');
        }

        function confirmTopup() {
            const uid = document.getElementById('topupUid').value;
            const amount = parseInt(document.getElementById('topupAmount').value);
            
            const index = vehicles.findIndex(v => v.uid === uid);
            if(index !== -1 && amount > 0) {
                vehicles[index].bal += amount;
                closeModals();
                renderTable();
                
                setTimeout(() => {
                    const rowId = `row-${uid.replace(/ /g, '-')}`;
                    const row = document.getElementById(rowId);
                    if(row) {
                        row.classList.remove('row-animate');
                        row.classList.add('flash-update');
                        setTimeout(() => row.classList.remove('flash-update'), 1000);
                    }
                }, 50);
            }
        }

        renderTable();
    </script>
</body>
</html>
