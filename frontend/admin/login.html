<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RFID Toll System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0D0F14;
            --bg-secondary: #161A24;
            --bg-tertiary: #1E2433;
            --accent-amber: #F5A623;
            --accent-green: #00FF88;
            --accent-red: #FF3B4E;
            --accent-blue: #00BFFF;
            --text-primary: #E8ECF0;
            --text-muted: #6B7A99;
            --border: #2A3148;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'IBM Plex Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Grid Background */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        /* Ambient Glow Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        .orb-amber {
            top: 20%;
            left: 30%;
            width: 400px;
            height: 400px;
            background: var(--accent-amber);
        }
        .orb-blue {
            bottom: 10%;
            right: 20%;
            width: 500px;
            height: 500px;
            background: var(--accent-blue);
        }

        /* Login Card Wrapper */
        .login-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: slideUpFade 0.8s ease-out forwards;
        }

        /* Login Card */
        .login-card {
            width: 420px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 48px;
            box-shadow: 0 0 60px rgba(245, 166, 35, 0.08);
            position: relative;
            overflow: hidden;
        }

        .login-card.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--accent-red);
        }

        /* Top Badge */
        .badge {
            display: inline-block;
            background-color: rgba(245, 166, 35, 0.1);
            color: var(--accent-amber);
            font-size: 0.75rem;
            padding: 4px 8px;
            border: 1px solid var(--accent-amber);
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        /* Typography */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-tertiary);
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1rem;
            padding: 12px 16px;
            outline: none;
            transition: all 0.3s;
        }

        .form-control::placeholder {
            color: rgba(107, 122, 153, 0.5);
        }

        .form-control:focus {
            border-bottom: 1px solid var(--accent-amber);
            background-color: rgba(30, 36, 51, 0.8);
        }

        .form-control:focus + label {
            color: var(--accent-amber);
        }

        /* Show/Hide Password Toggle */
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
        }
        .toggle-password:hover {
            color: var(--text-primary);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background-color: var(--accent-amber);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            padding: 16px;
            border: none;
            cursor: pointer;
            margin-top: 16px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 20px rgba(245, 166, 35, 0.3);
        }

        /* Button Scanline Shimmer Effect */
        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.3s;
            opacity: 0;
        }

        .btn-submit:hover::after {
            animation: shimmer 1s infinite;
            opacity: 1;
        }

        /* Status Indicator */
        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulseDot 2s infinite;
        }

        .status-text {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* Error/Success Messages */
        .message-box {
            margin-top: 16px;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }

        .error-msg {
            color: var(--accent-red);
            display: none;
        }

        /* Overlay for Success */
        .success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(22, 26, 36, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 20;
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .success-text {
            color: var(--accent-green);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        /* Footer Note */
        .footer-note {
            color: rgba(107, 122, 153, 0.5);
            font-size: 0.7rem;
            text-align: center;
        }

        /* Animations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseDot {
            0% { opacity: 0.4; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            50% { opacity: 1; box-shadow: 0 0 8px 2px rgba(0, 255, 136, 0.2); }
            100% { opacity: 0.4; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        @keyframes shimmer {
            0% { transform: rotate(45deg) translateX(-100%); }
            100% { transform: rotate(45deg) translateX(100%); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="glow-orb orb-amber"></div>
    <div class="glow-orb orb-blue"></div>

    <div class="login-wrapper">
        <div class="login-card" id="loginCard">
            <div class="badge">OPERATOR ACCESS</div>
            <h1>ADMIN LOGIN</h1>
            <p class="subtitle">RFID Toll Management System</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">OPERATOR_ID</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-control" placeholder="e.g. admin" autocomplete="off" spellcheck="false">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">AUTH_KEY</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="••••••••">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">👁</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">AUTHENTICATE &rarr;</button>

                <div class="message-box">
                    <div class="error-msg" id="errorMsg">⚠ ACCESS DENIED — Invalid credentials</div>
                </div>
            </form>

            <div class="status-row">
                <div class="status-dot"></div>
                <div class="status-text">SYSTEM ONLINE</div>
            </div>

            <div class="success-overlay" id="successOverlay">
                <div class="status-dot" style="width: 16px; height: 16px; animation: none; box-shadow: 0 0 20px var(--accent-green);"></div>
                <div class="success-text">ACCESS GRANTED</div>
                <div style="color: var(--text-muted); font-size: 0.8rem;">Routing to dashboard...</div>
            </div>
        </div>

        <div class="footer-note">
            Integral University | BCA Final Project 2025–2026
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const loginCard = document.getElementById('loginCard');
            const errorMsg = document.getElementById('errorMsg');
            const successOverlay = document.getElementById('successOverlay');
            const submitBtn = document.getElementById('submitBtn');

            // Toggle Password Visibility
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePasswordBtn.textContent = type === 'password' ? '👁' : '👁‍🗨';
            });

            // Handle Login Submission
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault(); // Prevent page reload

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                // Reset states
                loginCard.classList.remove('shake');
                errorMsg.style.display = 'none';

                // Prototype Authentication Logic
                if (username === 'admin' && password === 'toll2026') {
                    // Success State
                    submitBtn.textContent = 'AUTHENTICATING...';
                    
                    setTimeout(() => {
                        successOverlay.classList.add('active');
                        
                        // Redirect to Dashboard after 1.5s
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    }, 500);

                } else {
                    // Error State
                    // trigger reflow to restart CSS animation
                    void loginCard.offsetWidth; 
                    loginCard.classList.add('shake');
                    errorMsg.style.display = 'block';
                    passwordInput.value = ''; // clear password
                    passwordInput.focus();
                }
            });
        });
    </script>
</body>
</html>
